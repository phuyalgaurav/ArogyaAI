name: arogya-dev
services:
  api:
    build: ../services/api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_metadata:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:17-alpine
    profiles: ["data"]
    environment:
      POSTGRES_DB: arogya_dev
      POSTGRES_USER: arogya_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    profiles: ["data"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  api_metadata:
  postgres_data:
